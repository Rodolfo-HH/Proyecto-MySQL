services:
  postgres_240836:
    image: postgres:15-alpine
    container_name: postgres_240836
    restart: always
    environment:
      POSTGRES_USER: user_240836
      POSTGRES_PASSWORD: Password240836!
      POSTGRES_DB: db_240836
    ports:
      - "40837:5432"
    volumes:
      - pg_data_240836:/var/lib/postgresql/data

  pgadmin_240836:
    image: dpage/pgadmin4
    container_name: pgadmin_240836
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: RootPassword240836!
    ports:
      - "40836:80"
    depends_on:
      - postgres_240836

volumes:
  pg_data_240836:
    driver: local